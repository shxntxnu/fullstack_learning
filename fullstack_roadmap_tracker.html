<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Stack Engineering 12-Week Interactive Build Log</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-color: #38bdf8;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --stage-1: #38bdf8;
            --stage-2: #a855f7;
            --stage-3: #f59e0b;
            --stage-4: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Overall Progress Dashboard */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .dash-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 1.25rem;
        }

        .dash-card h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .dash-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: var(--card-border);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 0.75rem;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, var(--accent-color), var(--accent-green));
            transition: width 0.3s ease;
        }

        /* Filter Controls */
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--accent-color);
            background: #1e293b;
            color: var(--accent-color);
        }

        /* Week Log Accordion Cards */
        .week-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            margin-bottom: 1.5rem;
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .week-card:hover {
            border-color: #475569;
        }

        .week-header {
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
        }

        .week-title-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .stage-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .badge-stage-1 { background: rgba(56, 189, 248, 0.15); color: var(--stage-1); }
        .badge-stage-2 { background: rgba(168, 85, 247, 0.15); color: var(--stage-2); }
        .badge-stage-3 { background: rgba(245, 158, 11, 0.15); color: var(--stage-3); }
        .badge-stage-4 { background: rgba(16, 185, 129, 0.15); color: var(--stage-4); }

        .week-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .week-content {
            display: none;
            padding: 1.5rem;
            border-top: 1px solid var(--card-border);
        }

        .week-card.open .week-content {
            display: block;
        }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .detail-block {
            background: rgba(15, 23, 42, 0.5);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-block h4 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        ul.task-list {
            list-style: none;
        }

        ul.task-list li {
            position: relative;
            padding-left: 1.8rem;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .task-checkbox {
            position: absolute;
            left: 0;
            top: 0.2rem;
            cursor: pointer;
        }

        .resource-link {
            color: #38bdf8;
            text-decoration: none;
        }

        .resource-link:hover {
            text-decoration: underline;
        }

        .self-check-box {
            margin-top: 1rem;
            background: rgba(56, 189, 248, 0.05);
            border-left: 3px solid var(--accent-color);
            padding: 0.75rem 1rem;
            border-radius: 0 6px 6px 0;
            font-size: 0.88rem;
        }

        .citation-tag {
            font-size: 0.7rem;
            color: var(--text-muted);
            vertical-align: super;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>12-Week Full-Stack Engineer Build Log</h1>
        <p class="subtitle">A targeted, dynamic execution timeline & resource tracker mapped directly to your 4-stage engineering roadmap.</p>
    </header>

    <!-- Dashboard Metrics -->
    <div class="dashboard">
        <div class="dash-card">
            <h3>Overall Completion</h3>
            <div class="value" id="overall-percentage">0%</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>
        <div class="dash-card">
            <h3>Checkpoints Completed</h3>
            <div class="value" id="checkpoints-count">0 / 4</div>
        </div>
        <div class="dash-card">
            <h3>Current Focus</h3>
            <div class="value" style="font-size: 1.2rem; margin-top: 0.5rem;" id="current-stage-label">Stage 1: Core Fundamentals</div>
        </div>
    </div>

    <!-- Filter Buttons -->
    <div class="controls">
        <button class="filter-btn active" onclick="filterStage('all')">All Weeks</button>
        <button class="filter-btn" onclick="filterStage('stage-1')">Stage 1: Core Fundamentals</button>
        <button class="filter-btn" onclick="filterStage('stage-2')">Stage 2: Professional Practices</button>
        <button class="filter-btn" onclick="filterStage('stage-3')">Stage 3: Systems Thinking[cite: 1]</button>
        <button class="filter-btn" onclick="filterStage('stage-4')">Stage 4: Portfolio & Career[cite: 1]</button>
    </div>

    <!-- Timeline Accordion Container -->
    <div id="timeline-container">
        <!-- JS will dynamically inject week cards here -->
    </div>
</div>

<script>

        exercise: "Write (on paper or terminal) a raw SQL query joining 3 tables with filtering and sorting before implementing it in Prisma[cite: 1].",
        spineIncrement: "Model full relational schema (Users, Groups, Expenses, Settlements) in Postgres with real DB constraints[cite: 1].",

    },
    {
        week: 3,
        stage: "stage-1",
        stageName: "Stage 1",
        title: "Week 3: Custom Authentication Architecture & Spine v1 Deploy",
        topics: [
            "Password Hashing: Bcrypt / Argon2 security models[cite: 1]",

    },

        topics: [
            "End-to-End Automated Testing with Playwright[cite: 1]",

        ],

        spineIncrement: "Add a full Playwright E2E test covering Signup -> Create Group -> Add Expense flow[cite: 1].",
        selfCheck: "Walk through your CI pipeline step-by-step: what does each stage catch, and what would slip through if removed?[cite: 1]"
    },

        topics: [

        exercise: "Intentionally create an N+1 query in an endpoint, capture execution logs, inspect EXPLAIN ANALYZE output, and refactor[cite: 1].",

        topics: [

            "Frontend Performance: Code-splitting, dynamic imports, lazy loading[cite: 1]",

        ],
        resources: [

            "Web.dev: Dynamic Imports & Code Splitting in React",
            "Node.js Performance Profiling Documentation"
        ],
        exercise: "Deliberately attack your Stage 1-2 app with malicious inputs (script tags, payload injections) and implement defenses[cite: 1].",
        spineIncrement: "Security pass across all endpoints; implement code-splitting to optimize initial web app load times[cite: 1].",
        selfCheck: "Show one place a malicious user could break your app by sending unexpected input and how you closed it[cite: 1]."
    },
    {
        week: 9,
        stage: "stage-3",
        stageName: "Stage 3",
        title: "Week 9: Containerization (Docker) & Multi-Env Cloud Infra",
        topics: [
            "Dockerization: Writing multi-stage Dockerfiles & Docker Compose[cite: 1]",
            "Environment Configurations: Dev / Staging / Production isolation[cite: 1]",
            "Cloud Infrastructure Management (Azure/Railway/AWS)[cite: 1]"
        ],
        resources: [
            "Docker Docs: Multi-stage Builds for Node.js Applications",
            "Docker Compose Specifications",
            "12-Factor App Methodology: Environment Variables & Configs"
        ],
        exercise: "Write an optimized Dockerfile using multi-stage builds to minimize image size (<150MB) and orchestrate Postgres/Redis via Docker Compose[cite: 1].",
        spineIncrement: "Complete Spine v3: Whole app dockerized, running realtime + cache layer with separate staging/prod environment configs[cite: 1].",
        selfCheck: "Explain what every line in your Dockerfile does and why multi-stage builds are critical for production images[cite: 1]."
    },
    {
        week: 10,
        stage: "stage-4",
        stageName: "Stage 4",
        title: "Week 10: AI-Assisted Dev Discipline & System Design Basics",
        topics: [
            "AI Tool Discipline: Evaluating generated code quality vs blind reliance[cite: 1]",
            "System Design: Whiteboarding architecture, database scaling, dynamic load balancing[cite: 1]",
            "Refactoring for Production Integrity[cite: 1]"
        ],
        resources: [
            "Gaurav Sen / ByteByteGo: System Design Fundamentals",
            "Pragmatic Programmer: Critical Code Review & AI Auditing"
        ],
        exercise: "Whiteboard your Spine project architecture from scratch on Excalidraw; explain how you'd scale it if traffic grew 100x[cite: 1].",
        spineIncrement: "Perform an explicit audit on all AI-scaffolded boilerplate code; standardize patterns across the repository[cite: 1].",
        selfCheck: "Pick one place you used an AI tool—what would have broken if it gave subtly wrong code, and how did you verify it?[cite: 1]"
    },
    {
        week: 11,
        stage: "stage-4",
        stageName: "Stage 4",
        title: "Week 11: Production Documentation & Targeted DSA Practice",
        topics: [
            "Technical Writing: Architectural READMEs and Engineering Case Studies[cite: 1]",
            "DSA Essentials: HashMaps, Arrays, Two-Pointer Patterns (Junior-Mid Level)[cite: 1]",
            "STAR Format Behavioral Storytelling[cite: 1]"
        ],
        resources: [
            "Make a README: Writing Professional Project Documentation",
            "NeetCode 150: Essential HashMap & Two-Pointer Patterns",
            "STAR Method Guide for Technical Interviews"
        ],
        exercise: "Write a 2-page Case Study write-up detailing the 3 hardest technical decisions made in your Spine project and trade-offs made[cite: 1].",
        spineIncrement: "Publish complete Spine README explaining architectural choices ('why' not just 'what'), setup instructions, and design diagrams[cite: 1].",

    },
    {
        week: 12,
        stage: "stage-4",
        stageName: "Stage 4",
        title: "Week 12: Mock Interviews, Portfolio Launch & Job Submissions",
        topics: [
            "Live Code Walkthroughs & Technical Defensibility[cite: 1]",
            "Mock Technical Interviews (Peer or Mentor-led)[cite: 1]",
            "Market Launch & Targeted Application Outreach[cite: 1]"
        ],
        resources: [
            "Tech Interview Handbook: Final Round Readiness",
            "DixonBaxi & Full-Stack Role JD Benchmark Analysis"
        ],
        exercise: "Run a full 60-minute mock technical interview covering live coding, Spine project architectural defense, and STAR scenarios[cite: 1].",
        spineIncrement: "Complete Spine v4: Polished codebase, tag v1.0 release, live cloud demo links, and begin active application submissions[cite: 1].",
        selfCheck: "What is the single weakest part of your project, and what is your precise plan if a live technical interviewer homes in on it?[cite: 1]"
    }
];

function renderTimeline() {
    const container = document.getElementById('timeline-container');
    container.innerHTML = '';

    roadmapData.forEach((item) => {
        const card = document.createElement('div');
        card.className = `week-card ${item.stage}`;
        card.setAttribute('data-stage', item.stage);

        card.innerHTML = `
            <div class="week-header" onclick="toggleCard(this)">
                <div class="week-title-area">
                    <span class="stage-badge badge-${item.stage}">${item.stageName}</span>
                    <span class="week-title">${item.title}</span>
                </div>
                <div>
                    <input type="checkbox" class="task-checkbox" onchange="updateProgress(event)" id="check-week-${item.week}">
                    <label for="check-week-${item.week}" onclick="event.stopPropagation()" style="font-size:0.85rem; color:var(--text-muted); cursor:pointer;">Mark Complete</label>
                </div>
            </div>
            <div class="week-content">
                <div class="section-grid">
                    <div class="detail-block">
                        <h4>Learning Topics</h4>
                        <ul class="task-list">
                            ${item.topics.map(t => `<li>${t}</li>`).join('')}
                        </ul>
                    </div>
                    <div class="detail-block">
                        <h4>Targeted Resources</h4>
                        <ul class="task-list">
                            ${item.resources.map(r => `<li><a href="#" class="resource-link">${r}</a></li>`).join('')}
                        </ul>
                    </div>
                    <div class="detail-block">
                        <h4>Targeted Exercise</h4>
                        <p style="font-size:0.9rem; color:#cbd5e1;">${item.exercise}</p>
                    </div>
                    <div class="detail-block">
                        <h4>Spine Project Milestone</h4>
                        <p style="font-size:0.9rem; color:#cbd5e1;">${item.spineIncrement}</p>
                    </div>
                </div>
                <div class="self-check-box">
                    <strong>Self-Check Interview Question:</strong> ${item.selfCheck}
                </div>
            </div>
        `;
        container.appendChild(card);
    });
}

function toggleCard(headerElem) {
    const card = headerElem.parentElement;
    card.classList.toggle('open');
}

function filterStage(stageClass) {
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    const cards = document.querySelectorAll('.week-card');
    cards.forEach(card => {
        if (stageClass === 'all' || card.classList.contains(stageClass)) {
            card.style.display = 'block';
        } else {
            card.style.display = 'none';
        }
    });
}

function updateProgress(e) {
    e.stopPropagation();
    const total = roadmapData.length;
    const checked = document.querySelectorAll('.task-checkbox:checked').length;
    const percentage = Math.round((checked / total) * 100);

    document.getElementById('overall-percentage').innerText = `${percentage}%`;
    document.getElementById('progress-fill').style.width = `${percentage}%`;

    // Compute Spine stage milestones completed
    let spineCount = 0;
    if (document.getElementById('check-week-3')?.checked) spineCount++;
    if (document.getElementById('check-week-6')?.checked) spineCount++;
    if (document.getElementById('check-week-9')?.checked) spineCount++;
    if (document.getElementById('check-week-12')?.checked) spineCount++;
    document.getElementById('checkpoints-count').innerText = `${spineCount} / 4`;

    // Update Stage Focus Label
    if (checked < 3) {
        document.getElementById('current-stage-label').innerText = "Stage 1: Core Fundamentals";
    } else if (checked < 6) {
        document.getElementById('current-stage-label').innerText = "Stage 2: Professional Practices";
    } else if (checked < 9) {
        document.getElementById('current-stage-label').innerText = "Stage 3: Systems Thinking";
    } else {
        document.getElementById('current-stage-label').innerText = "Stage 4: Portfolio & Interviews";
    }
}

// Initial Render
renderTimeline();
</script>
</body>
</html>
